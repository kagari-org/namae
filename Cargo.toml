[package]
name = "namae"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "namae"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hickory-proto = "0.25"
hickory-server = "0.25"
hkdf = "0.12"
hmac = "0.12"
humantime = "2"
libc = "0.2"
rand = "0.9"
rtnetlink = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
